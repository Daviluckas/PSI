{% extends "base.html" %}

{% block conteudo %}
    <h2>Biblioteca</h2>

    <ul>
        {%for livro in livros%}
            <li>{{livro['titulo']}} - {{livro['autor']}}</li>
            {%if livro['disponivel']%}
                <span>Disponivel</span>
            {%else%}
                <span>Indisponivel</span>
            {%endif%}
        {%endfor%}
    </ul>
{% endblock %}
