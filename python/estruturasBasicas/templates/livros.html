{% extends "base.html" %}

{% block conteudo %}
    <h2>Biblioteca</h2>

    <ul>
        {%for livro in livros%}
            <li>{{livro['titulo']}} - {{livro['autor']}}</li>
            {%if livro['disponivel']%}
                <span>Disponivel</span>
            {%else%}
                <span>Indisponivel</span>
            {%endif%}
            <a href="{{ url_for('detalhe_livro', livro_id=livro['id']) }}">Ver detalhes</a>
            {%endfor%}
        </ul>
        <a href="{{ url_for('disponiveis', livros=livros_disponiveis) }}">Livros disponiveis</a>
{% endblock %}
