{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<h1>Login</h1>

<form method="POST">

    <div>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email">
    </div>
    <div>
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha">
    </div>
    <button type="submit">Entrar</button>

</form>
{% endblock %}
